# Server
server.port=${SERVER_PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auction_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# Replace JWT_SECRET with a strong random secret before running outside local development
jwt.secret=${JWT_SECRET:replace-with-a-strong-256-bit-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App
app.name=AuctionPlatform
spring.application.name=auction-platform

# Admin seed (auto-created on first startup if no admin exists)
# Change these before first run so a default admin is not created with guessable credentials
admin.seed.email=${ADMIN_SEED_EMAIL:admin@example.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:ChangeMeBeforeFirstRun!}
admin.seed.username=${ADMIN_SEED_USERNAME:admin}
admin.seed.firstName=${ADMIN_SEED_FIRST_NAME:Admin}
admin.seed.lastName=${ADMIN_SEED_LAST_NAME:User}

# Jackson
spring.jackson.default-property-inclusion=always
